global:
  services:
    ingestion:
      rest-ingestion:
        replicas: 2
    processing:
      pages-optimized-img-rewriter:
        stateful: true
      json-aggregator:
        stateful: true
      rendering-engine:
        stateful: true
      composition-engine:
        stateful: true
      data-collector:
        stateful: true
      sitemap-generator:
        stateful: true
    edge:
      search-sink:
        stateful: true
        replicas: 2
      web-server-sink:
        stateful: true
        replicas: 2
clusters:
  eu-west-par-processing:
    enabled: true
  eu-west-par-edge:
    enabled: true
